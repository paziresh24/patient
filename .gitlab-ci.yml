stages:
  - build

.build-docker-common:
  image: docker:cli
  services:
    - name: docker:dind
      command:
        - "--registry-mirror=https://docker.devneeds.ir"
        - "--insecure-registry=78.39.136.53:5050"
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    OMNIBUS_REGISTRY: "78.39.136.53:5050"
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - script_failure
      - job_execution_timeout

build-docker-image:
  extends: .build-docker-common
  stage: build

  before_script:
    - apk add --no-cache curl jq
    - until docker info > /dev/null 2>&1; do echo "waiting for dockerd..."; sleep 1; done
    # Live pulls still hit Omnibus. Login/push only to :5050 (skip broken CDN hostname).
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$OMNIBUS_REGISTRY"
    - |
      jq '. + {"max-concurrent-uploads": 1, "max-concurrent-downloads": 3}' \
        "$HOME/.docker/config.json" > /tmp/docker-config.json \
        && mv /tmp/docker-config.json "$HOME/.docker/config.json"

  script:
    - |
      docker build --provenance=false \
        -t "${OMNIBUS_REGISTRY}/${CI_PROJECT_PATH}:latest" \
        -t "${OMNIBUS_REGISTRY}/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}" \
        .

    - |
      push_with_retry() {
        local image="$1"
        local attempt=1
        local max=3
        while [ "$attempt" -le "$max" ]; do
          echo "Pushing $image (attempt $attempt/$max)..."
          if docker push "$image"; then
            return 0
          fi
          echo "Push failed for $image (attempt $attempt/$max)"
          if [ "$attempt" -eq "$max" ]; then
            return 1
          fi
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
      }
      push_with_retry "${OMNIBUS_REGISTRY}/${CI_PROJECT_PATH}:${CI_COMMIT_SHORT_SHA}"
      push_with_retry "${OMNIBUS_REGISTRY}/${CI_PROJECT_PATH}:latest"

    - |
      cat <<EOF > webhook_payload.json
      {
        "project_name": "$CI_PROJECT_NAME",
        "commit_sha": "$CI_COMMIT_SHORT_SHA",
        "branch": "$CI_COMMIT_BRANCH",
        "registry_image": "gitlab-registry.paziresh24.com/$CI_PROJECT_PATH:$CI_COMMIT_SHORT_SHA",
        "status": "build_success"
      }
      EOF

    - >
      curl -X POST https://apigw.paziresh24.com/v1/n8n-search/webhook/p24-gitlab-update-webhook
      -H "Content-Type: application/json"
      -d @webhook_payload.json

  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: always

build-docker-image-next:
  extends: .build-docker-common
  stage: build
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""
    ZOT_REGISTRY: registry.paziresh24.com
    ZOT_IMAGE: registry.paziresh24.com/aboulfazl-entezari/patient

  before_script:
    - apk add --no-cache curl jq
    - until docker info > /dev/null 2>&1; do echo "waiting for dockerd..."; sleep 1; done
    - echo "$MOBIN_ZOT_REGISTRY_PASSWORD" | docker login -u "$MOBIN_ZOT_REGISTRY_USER" --password-stdin "$ZOT_REGISTRY"
    - |
      jq '. + {"max-concurrent-uploads": 1, "max-concurrent-downloads": 3}' \
        "$HOME/.docker/config.json" > /tmp/docker-config.json \
        && mv /tmp/docker-config.json "$HOME/.docker/config.json"

  script:
    - docker build --provenance=false -t "$ZOT_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      push_with_retry() {
        local image="$1"
        local attempt=1
        local max=3
        while [ "$attempt" -le "$max" ]; do
          echo "Pushing $image (attempt $attempt/$max)..."
          if docker push "$image"; then
            return 0
          fi
          echo "Push failed for $image (attempt $attempt/$max)"
          if [ "$attempt" -eq "$max" ]; then
            return 1
          fi
          sleep $((attempt * 10))
          attempt=$((attempt + 1))
        done
      }
      push_with_retry "$ZOT_IMAGE:$CI_COMMIT_SHORT_SHA"

    - |
      cat <<EOF > webhook_payload.json
      {
        "project_name": "$CI_PROJECT_NAME",
        "commit_sha": "$CI_COMMIT_SHORT_SHA",
        "branch": "$CI_COMMIT_BRANCH",
        "registry_image": "$ZOT_IMAGE:$CI_COMMIT_SHORT_SHA",
        "status": "build_success"
      }
      EOF

    - >
      curl -X POST https://apigw.paziresh24.com/v1/n8n-search/webhook/p24-gitlab-update-webhook
      -H "Content-Type: application/json"
      -d @webhook_payload.json

  rules:
    - if: $CI_COMMIT_BRANCH == "next"
      when: always
